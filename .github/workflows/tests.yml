name: Python tests

# Source-only CI for osmium-core: it runs the Python unit suite. No image is
# built here — the image repos that embed this core as a submodule own the
# OTA/image workflows.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          # App deps; tests needing absent native tools (sox/flac) are skipped
          # or xfail by the suite itself.
          [ -f requirements.txt ] && python -m pip install --quiet -r requirements.txt || true

      - name: Run the test suite
        run: python -m pytest tests/ -q
